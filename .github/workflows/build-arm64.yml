name: QGIS ARM64 Native (Qt5, Ubuntu 22.04)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout QGIS
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update

          # build tools
          sudo apt install -y \
            build-essential cmake pkg-config \
            flex bison \
            python3 python3-dev python3-pip \
            git wget

          # Qt5 (officially supported on 22.04)
          sudo apt install -y \
            qtbase5-dev \
            qttools5-dev qttools5-dev-tools \
            qtwayland5 \
            libqt5svg5-dev \
            libqt5networkauth5-dev

          # GIS core deps
          sudo apt install -y \
            libgdal-dev \
            libproj-dev \
            libgeos-dev \
            libsqlite3-dev \
            libspatialite-dev \
            libspatialindex-dev \
            libexpat1-dev \
            libqwt-qt5-dev \
            libqscintilla2-qt5-dev \
            libqca-qt5-2-dev \
            libzip-dev \
            libexiv2-dev \
            protobuf-compiler

          # PyQGIS (Qt5)
          sudo apt install -y \
            python3-sip \
            python3-pyqt5 \
            python3-numpy

      - name: Build QGIS
        run: |
          mkdir -p build
          cd build

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DWITH_QT6=OFF \
            -DWITH_QTKEYCHAIN=OFF \
            -DWITH_BINDINGS=ON \
            -DWITH_GRASS=OFF \
            -DWITH_PDAL=OFF \
            -DWITH_3D=ON \
            -DWITH_DESKTOP=ON

          make -j$(nproc)
          sudo make install

      - name: Package runtime
        run: |
          mkdir -p out/qgis-arm64-runtime/lib out/qgis-arm64-runtime/share

          cp /usr/local/bin/qgis out/qgis-arm64-runtime/
          cp /usr/local/lib/libqgis_core.so out/qgis-arm64-runtime/lib/
          cp /usr/local/lib/libqgis_gui.so  out/qgis-arm64-runtime/lib/
          cp -r /usr/local/share/qgis out/qgis-arm64-runtime/share/

          tar -czf qgis-arm64-runtime.tar.gz -C out qgis-arm64-runtime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qgis-arm64-runtime
          path: qgis-arm64-runtime.tar.gz
